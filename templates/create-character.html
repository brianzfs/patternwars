{% extends "base.html" %}

{% block content %}

    <h1>Charakter erstellen</h1>

    <div class="row justify-content-center w-100">
        <div class="col-sm-8 col-md-6 col-lg-4">

            <form id="character-form" class="card card-body gap-2" action="{{ url_for('create_character') }}" method="post">

                {% if error %}
                    <div class="alert alert-danger mb-0" role="alert">{{ error }}</div>
                {% endif %}

                <div>
                    <label for="name" class="form-label fw-bold">Name</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div>
                    <label for="role" class="form-label fw-bold">Rolle</label>
                    <input type="text" id="role" name="role" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary fw-bold mt-2">Erstellen</button>
            </form>

        </div>
    </div>

{% endblock %}
