{% extends "base.html" %}
{% set user = current_user() %}


{% block content %}

    <h1>Willkommen, {{ user.username }}!</h1>
    <p class="lead text-body-secondary">Hier ist deine Übersicht.</p>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">

        <div class="col">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5 class="card-title">Charaktere</h5>
                    <p class="card-text display-5">{{ user.characters|length }}</p>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5 class="card-title">Fights</h5>
                    <p class="card-text display-5">{{ user.wins + user.losses }}</p>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5 class="card-title">Gewonnen</h5>
                    <p class="card-text display-5 text-success">{{ user.wins }}</p>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card text-center h-100">
                <div class="card-body">
                    <h5 class="card-title">Verloren</h5>
                    <p class="card-text display-5 text-danger">{{ user.losses }}</p>
                </div>
            </div>
        </div>

    </div>

{% endblock %}
