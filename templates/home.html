{% extends "base.html" %}
{% set user = current_user() %}


{% block content %}

    <h1>Willkommen, <span class="bold accent">{{ user.username }}!</span></h1>

    <div id="home-cards">
      
       <div class="card">
            <h1>{{ user.characters|length }}</h1>
            <h2>Charaktere</h2>
        </div>

        <div class="card">
            <h1>{{ user.wins + user.losses}}</h1>
            <h2>Fights</h2>
        </div>

         <div class="card">
            <h1>{{ user.wins }}</h1>
            <h2>Gewonnen</h2>
        </div>

         <div class="card">
            <h1>{{ user.losses }}</h1>
            <h2>Verloren</h2>
        </div>

    </div>

 


{% endblock %}
