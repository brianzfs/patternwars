{% extends "base.html" %}
{% set user = current_user() %}

{% block content %}

    <h1> Du hast <span class="fw-bold text-primary">{{ user.characters|length }} </span> Charaktere </h1>

    <div class="row justify-content-center w-100">
        <div class="col-md-10 col-lg-8">
            <div class="row row-cols-1 row-cols-sm-2 g-3 justify-content-center">
                {% for character in user.characters %}
                    <div class="col">
                        <article class="card h-100 rounded-4">
                            <div class="card-body d-flex flex-column align-items-center justify-content-center gap-2 p-4">
                                <h2 class="card-title fs-5 mb-0">{{ character.name }}</h2>
                                <span class="badge rounded-pill text-bg-secondary fs-6 fw-normal">{{ character.role }}</span>
                            </div>
                        </article>
                    </div>
                {% else %}
                    <p class="col-12 text-center text-body-secondary">Du hast noch keine Charaktere.</p>
                {% endfor %}
            </div>
        </div>
    </div>

{% endblock %}
