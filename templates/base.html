<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Wars</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="container my-3">
        <div class="navbar flex-nowrap bg-body-tertiary border rounded-4 shadow px-3 user-select-none">

            <span class="navbar-brand fs-4 fw-bold">Pattern Wars</span>

            {% if is_logged_in() %}

                <nav class="nav nav-pills flex-nowrap gap-1 gap-sm-2 ms-auto">
                    <a href="/" class="nav-link rounded-circle p-2 p-sm-3 lh-1 {% if request.endpoint == 'home' %}active{% else %}bg-body-secondary link-body-emphasis{% endif %}"
                        {% if request.endpoint == 'home' %}aria-current="page"{% endif %} title="Home" aria-label="Home">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-house preview-icon">
                            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                            <path
                                d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        </svg>

                    </a>


                    <a href="/characters" class="nav-link rounded-circle p-2 p-sm-3 lh-1 {% if request.endpoint == 'characters' %}active{% else %}bg-body-secondary link-body-emphasis{% endif %}"
                        {% if request.endpoint == 'characters' %}aria-current="page"{% endif %} title="Characters"
                        aria-label="Characters">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-sword preview-icon">
                            <path d="m11 19-6-6" />
                            <path d="m5 21-2-2" />
                            <path d="m8 16-4 4" />
                            <path d="M9.5 17.5 20.414 6.586A2 2 0 0021 5.172V3h-2.172a2 2 0 00-1.414.586L6.5 14.5" />
                        </svg>

                    </a>


                    <a href="/create-character" class="nav-link rounded-circle p-2 p-sm-3 lh-1 {% if request.endpoint == 'create_character' %}active{% else %}bg-body-secondary link-body-emphasis{% endif %}"
                        {% if request.endpoint == 'create_character' %}aria-current="page"{% endif %}
                        title="Create Character" aria-label="Create Character">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-plus preview-icon">
                            <path d="M5 12h14" />
                            <path d="M12 5v14" />
                        </svg>

                    </a>

                </nav>

                <div class="dropdown ms-2 ms-sm-4" title="Profile">

                    <button type="button" class="btn p-0 border-0 rounded-circle" data-bs-toggle="dropdown"
                        aria-expanded="false" aria-label="Profile Menu">
                        <img src="{{ url_for('static', filename='profile_picture.png') }}" alt="Profilbild"
                            width="56" height="56" class="d-block rounded-circle border border-2 object-fit-cover">
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <form action="{{ url_for('logout') }}" method="post">
                                <button type="submit" class="dropdown-item">Abmelden</button>
                            </form>
                        </li>
                    </ul>

                </div>

            {% endif %}
        </div>
    </header>

    <main class="container flex-grow-1 d-flex flex-column align-items-center gap-4 py-3 mb-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="d-flex align-items-center justify-content-center gap-1 py-1 border-top bg-body small text-body-secondary shadow">

        <span>Made with</span>

        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="red" stroke="red"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart preview-icon">
            <path
                d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" />
        </svg>

        <span>by Brian & Tobias</span>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
