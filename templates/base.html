<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Wars</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">

            <a class="navbar-brand" href="{{ url_for('home') }}">Pattern Wars</a>

            {% if is_logged_in() %}

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
                    aria-controls="main-navbar" aria-expanded="false" aria-label="Navigation umschalten">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="main-navbar">

                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                                {% if request.endpoint == 'home' %}aria-current="page"{% endif %}
                                href="{{ url_for('home') }}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'characters' %}active{% endif %}"
                                {% if request.endpoint == 'characters' %}aria-current="page"{% endif %}
                                href="{{ url_for('characters') }}">Charaktere</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'create_character' %}active{% endif %}"
                                {% if request.endpoint == 'create_character' %}aria-current="page"{% endif %}
                                href="{{ url_for('create_character') }}">Charakter erstellen</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                <img src="{{ url_for('static', filename='profile_picture.png') }}" alt="Profilbild"
                                    width="32" height="32" class="rounded-circle me-1">
                                {{ current_user().username }}
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <form action="{{ url_for('logout') }}" method="post">
                                        <button type="submit" class="dropdown-item">Abmelden</button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    </ul>

                </div>

            {% endif %}

        </div>
    </nav>

    <main class="container flex-grow-1 py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-3 bg-body-tertiary border-top">
        <div class="container text-center text-body-secondary">
            Made with <span class="text-danger">&hearts;</span> by Brian & Tobias
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
