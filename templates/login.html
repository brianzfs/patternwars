{% extends "base.html" %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-4">

            <form id="login-form" class="py-5" action="{{ url_for('login') }}" method="post">

                <h1 class="h3 mb-3 fw-normal">Bitte anmelden</h1>

                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <div class="form-floating mb-2">
                    <input type="text" id="username" autocomplete="off" name="username" class="form-control"
                        placeholder="Username" required>
                    <label for="username">Username</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Passwort"
                        required>
                    <label for="password">Passwort</label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>

            </form>

        </div>
    </div>

{% endblock %}
