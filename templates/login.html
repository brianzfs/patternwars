{% extends "base.html" %}

{% block content %}

    <div class="row justify-content-center w-100">
        <div class="col-sm-8 col-md-6 col-lg-4">

            <form id="login-form" class="card card-body gap-2" action="{{ url_for('login') }}" method="post">

                {% if error %}
                    <div class="alert alert-danger d-flex flex-column align-items-center text-center mb-0" role="alert">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="48"
                             height="48"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             class="lucide lucide-triangle-alert preview-icon mb-2">
                            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
                            <path d="M12 9v4" />
                            <path d="M12 17h.01" />
                        </svg>
                        <span>{{ error }}</span>
                    </div>
                {% endif %}

                <div>
                    <label for="username" class="form-label fw-bold">Username</label>
                    <input type="text" id="username" autocomplete="off" name="username" class="form-control" required>
                </div>

                <div>
                    <label for="password" class="form-label fw-bold">Passwort</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary fw-bold mt-2">Login</button>

            </form>

        </div>
    </div>

{% endblock %}
